<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>텍스트 비교 도구(v1.0)</title>
  <style>
    :root{
      --bg:#ffffff;
      --card:#ffffff;
      --text:#222222;
      --muted:#6b7280;
      --brand:#0056b8;
      --brand-dark:#00479a;
      --brand-soft:#e4effb;
      --border:#d4dbe8;
      --radius-lg:6px;
      --shadow-soft:0 10px 24px rgba(15,23,42,.06);
      --add-bg:#ecfdf3;
      --add-text:#027a48;
      --remove-bg:#fef3f2;
      --remove-text:#b42318;
      --same-bg:#f8fafc;
    }

    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;}
    body{
      font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .app{
      max-width:1200px;
      margin:0 auto;
      padding:24px 16px 32px;
    }

    header{
      text-align:center;
      margin-bottom:16px;
    }

    header h1{
      font-size:24px;
      font-weight:600;
      letter-spacing:-0.02em;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      color:#111827;
    }

    .logo-badge{
      width:32px;
      height:32px;
      border-radius:6px;
      background:var(--brand);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-weight:700;
      font-size:16px;
    }

    header p{
      margin-top:4px;
      font-size:13px;
      color:var(--muted);
    }

    .panel{
      background:var(--card);
      border-radius:var(--radius-lg);
      border:1px solid var(--border);
      box-shadow:var(--shadow-soft);
      padding:16px;
      min-width:0;
      margin-top:16px;
    }

    .panel-title{
      font-size:18px;
      font-weight:600;
      margin-bottom:8px;
    }

    .panel-desc{
      font-size:12px;
      color:var(--muted);
      margin-bottom:12px;
      line-height:1.55;
    }

    .input-grid{
      display:grid;
      grid-template-columns:minmax(0, 1fr) minmax(0, 1fr);
      gap:16px;
      margin-top:8px;
    }

    @media(max-width:960px){
      .input-grid{
        grid-template-columns:1fr;
      }
    }

    .input-block-title{
      font-size:15px;
      font-weight:600;
      margin-bottom:8px;
      color:#111827;
    }

    textarea{
      width:100%;
      min-height:150px;
      resize:vertical;
      padding:12px;
      border:1px solid var(--border);
      border-radius:6px;
      background:#fff;
      color:#111827;
      font-size:13px;
      line-height:1.55;
      outline:none;
    }

    textarea:focus{
      border-color:#8ab4f8;
    }

    .options-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-top:14px;
    }

    .view-toggle{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .view-btn{
      border:1px solid var(--border);
      background:#fff;
      color:#111827;
      border-radius:6px;
      padding:8px 12px;
      font-size:12px;
      font-weight:600;
      cursor:pointer;
    }

    .view-btn.active{
      background:var(--brand-soft);
      border-color:#b7cff0;
      color:var(--brand);
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
    }

    .btn-ghost{
      background:#fff;
      color:#111827;
      border-radius:6px;
      border:1px solid var(--border);
      padding:8px 12px;
      font-size:12px;
      cursor:pointer;
    }

    .btn-ghost:hover{
      background:#f8fafc;
    }

    .result-box{
      border:1px solid var(--border);
      border-radius:6px;
      background:#fff;
      min-height:320px;
      padding:14px;
      overflow:auto;
    }

    .result-empty{
      color:var(--muted);
      font-size:13px;
      line-height:1.7;
    }

    .merged-line{
      font-size:13px;
      line-height:1.8;
      padding:6px 8px;
      border-radius:4px;
      margin-bottom:4px;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .merged-line.same{ background:var(--same-bg); }
    .merged-line.add{ background:var(--add-bg); color:var(--add-text); }
    .merged-line.remove{ background:var(--remove-bg); color:var(--remove-text); }

    .inline-token{
      display:inline;
      padding:1px 2px;
      border-radius:3px;
    }

    .inline-token.same{
      background:transparent;
      color:inherit;
    }

    .inline-token.add{
      background:var(--add-bg);
      color:var(--add-text);
      font-weight:600;
    }

    .inline-token.remove{
      background:var(--remove-bg);
      color:var(--remove-text);
      font-weight:600;
      text-decoration:line-through;
    }

    .side-by-side{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    @media(max-width:860px){
      .side-by-side{ grid-template-columns:1fr; }
    }

    .compare-col{
      border:1px solid #e5e7eb;
      border-radius:6px;
      overflow:hidden;
      background:#fff;
    }

    .compare-col-head{
      background:#f8fafc;
      border-bottom:1px solid #e5e7eb;
      padding:10px 12px;
      font-size:13px;
      font-weight:700;
    }

    .compare-col-body{
      padding:10px 12px;
    }

    .diff-line{
      font-size:13px;
      line-height:1.7;
      padding:4px 8px;
      border-radius:4px;
      margin-bottom:4px;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .diff-line.same{ background:var(--same-bg); }
    .diff-line.add{ background:var(--add-bg); color:var(--add-text); }
    .diff-line.remove{ background:var(--remove-bg); color:var(--remove-text); }

    .summary{
      margin-top:10px;
      font-size:12px;
      color:var(--muted);
      line-height:1.7;
    }

    .footer{
      margin-top:10px;
      font-size:11px;
      color:var(--muted);
      text-align:center;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>
        <span class="logo-badge">T</span>
        텍스트 비교 도구(v1.0)
      </h1>
      <p>원본 텍스트와 수정된 텍스트를 입력하면 변경 내용을 자동으로 비교합니다.</p>
    </header>

    <section class="panel">
      <div class="panel-title">1. 비교할 텍스트 입력</div>
      <div class="panel-desc">원본 텍스트와 수정된 텍스트를 입력하세요. 입력 즉시 비교 결과가 아래에 표시됩니다.</div>

      <div class="input-grid">
        <div>
          <div class="input-block-title">원본 텍스트</div>
          <textarea id="originalText" placeholder="원본 텍스트를 입력하세요."></textarea>
        </div>
        <div>
          <div class="input-block-title">수정된 텍스트</div>
          <textarea id="modifiedText" placeholder="수정된 텍스트를 입력하세요."></textarea>
        </div>
      </div>

      <div class="options-row">
        <div class="view-toggle">
          <button class="view-btn active" data-view="merged">합쳐서 보기</button>
          <button class="view-btn" data-view="split">좌우 나눠 보기</button>
        </div>

        <div class="actions">
          <button class="btn-ghost" onclick="resetCompare()">초기화</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">2. 비교 결과</div>
      <div class="panel-desc">원본과 수정된 텍스트를 비교하여 변경 내용을 표시합니다.</div>

      <div id="resultBox" class="result-box">
        <div class="result-empty">원본과 수정된 텍스트를 모두 입력하면 비교 결과가 나타납니다.</div>
      </div>

      <div id="summaryBox" class="summary"></div>
    </section>
  </div>

  <script>
    let currentView = 'merged';

    const originalTextEl = document.getElementById('originalText');
    const modifiedTextEl = document.getElementById('modifiedText');

    const viewButtons = Array.from(document.querySelectorAll('.view-btn'));
    viewButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        currentView = btn.dataset.view;
        viewButtons.forEach(b => b.classList.toggle('active', b === btn));
        runCompare();
      });
    });

    originalTextEl.addEventListener('input', runCompare);
    modifiedTextEl.addEventListener('input', runCompare);

    function escapeHtml(str){
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function lcsDiff(a, b){
      const m = a.length;
      const n = b.length;
      const dp = Array.from({length: m + 1}, () => Array(n + 1).fill(0));

      for(let i = m - 1; i >= 0; i--){
        for(let j = n - 1; j >= 0; j--){
          if(a[i] === b[j]) dp[i][j] = dp[i + 1][j + 1] + 1;
          else dp[i][j] = Math.max(dp[i + 1][j], dp[i][j + 1]);
        }
      }

      const result = [];
      let i = 0;
      let j = 0;

      while(i < m && j < n){
        if(a[i] === b[j]){
          result.push({type:'same', left:a[i], right:b[j]});
          i++;
          j++;
        }else if(dp[i + 1][j] >= dp[i][j + 1]){
          result.push({type:'remove', left:a[i], right:''});
          i++;
        }else{
          result.push({type:'add', left:'', right:b[j]});
          j++;
        }
      }

      while(i < m){
        result.push({type:'remove', left:a[i], right:''});
        i++;
      }

      while(j < n){
        result.push({type:'add', left:'', right:b[j]});
        j++;
      }

      return result;
    }

    function tokenizeByWhitespace(text){
      if(text === '') return [];
      return String(text).match(/\S+|\s+/g) || [];
    }

    function renderTokenDiff(oldText, newText){
      const oldTokens = tokenizeByWhitespace(oldText);
      const newTokens = tokenizeByWhitespace(newText);
      const tokenDiff = lcsDiff(oldTokens, newTokens);

      return tokenDiff.map(item => {
        if(item.type === 'same'){
          return `<span class="inline-token same">${escapeHtml(item.left)}</span>`;
        }
        if(item.type === 'remove'){
          return `<span class="inline-token remove">${escapeHtml(item.left)}</span>`;
        }
        return `<span class="inline-token add">${escapeHtml(item.right)}</span>`;
      }).join('');
    }

    function buildMergedHtml(diff){
      const htmlParts = [];
      let i = 0;

      while(i < diff.length){
        const item = diff[i];

        if(item.type === 'same'){
          htmlParts.push(`<div class="merged-line same">${escapeHtml(item.left)}</div>`);
          i++;
          continue;
        }

        if(
          i + 1 < diff.length &&
          (
            (diff[i].type === 'remove' && diff[i + 1].type === 'add') ||
            (diff[i].type === 'add' && diff[i + 1].type === 'remove')
          )
        ){
          const oldText = diff[i].type === 'remove' ? diff[i].left : diff[i + 1].left;
          const newText = diff[i].type === 'add' ? diff[i].right : diff[i + 1].right;
          htmlParts.push(`<div class="merged-line same">${renderTokenDiff(oldText, newText)}</div>`);
          i += 2;
          continue;
        }

        if(item.type === 'remove'){
          htmlParts.push(`<div class="merged-line remove">- ${escapeHtml(item.left)}</div>`);
        } else if(item.type === 'add'){
          htmlParts.push(`<div class="merged-line add">+ ${escapeHtml(item.right)}</div>`);
        }

        i++;
      }

      return htmlParts.join('');
    }

    function buildSplitHtml(diff){
      const leftHtml = diff.map(item => {
        if(item.type === 'same'){
          return `<div class="diff-line same">${escapeHtml(item.left)}</div>`;
        }
        if(item.type === 'remove'){
          return `<div class="diff-line remove">${escapeHtml(item.left)}</div>`;
        }
        return `<div class="diff-line same">&nbsp;</div>`;
      }).join('');

      const rightHtml = diff.map(item => {
        if(item.type === 'same'){
          return `<div class="diff-line same">${escapeHtml(item.right)}</div>`;
        }
        if(item.type === 'add'){
          return `<div class="diff-line add">${escapeHtml(item.right)}</div>`;
        }
        return `<div class="diff-line same">&nbsp;</div>`;
      }).join('');

      return `
        <div class="side-by-side">
          <div class="compare-col">
            <div class="compare-col-head">원본 텍스트</div>
            <div class="compare-col-body">${leftHtml}</div>
          </div>
          <div class="compare-col">
            <div class="compare-col-head">수정된 텍스트</div>
            <div class="compare-col-body">${rightHtml}</div>
          </div>
        </div>
      `;
    }

    function runCompare(){
      const original = originalTextEl.value;
      const modified = modifiedTextEl.value;
      const resultBox = document.getElementById('resultBox');
      const summaryBox = document.getElementById('summaryBox');

      if(!original.trim() || !modified.trim()){
        resultBox.innerHTML = '<div class="result-empty">원본과 수정된 텍스트를 모두 입력하면 비교 결과가 나타납니다.</div>';
        summaryBox.innerHTML = '';
        return;
      }

      const originalLines = original.split(/\r\n|\r|\n/);
      const modifiedLines = modified.split(/\r\n|\r|\n/);
      const diff = lcsDiff(originalLines, modifiedLines);

      const added = diff.filter(x => x.type === 'add').length;
      const removed = diff.filter(x => x.type === 'remove').length;
      const same = diff.filter(x => x.type === 'same').length;

      if(currentView === 'merged'){
        resultBox.innerHTML = buildMergedHtml(diff);
      }else{
        resultBox.innerHTML = buildSplitHtml(diff);
      }

      summaryBox.innerHTML = `동일 ${same}줄 / 추가 ${added}줄 / 삭제 ${removed}줄`;
    }

    function resetCompare(){
      originalTextEl.value = '';
      modifiedTextEl.value = '';
      document.getElementById('resultBox').innerHTML = '<div class="result-empty">원본과 수정된 텍스트를 모두 입력하면 비교 결과가 나타납니다.</div>';
      document.getElementById('summaryBox').innerHTML = '';
      currentView = 'merged';
      viewButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.view === 'merged'));
    }
  </script>
</body>
</html>
