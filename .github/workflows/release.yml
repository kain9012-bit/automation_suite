name: 설치본 빌드 및 배포

# v로 시작하는 태그를 밀면 설치본을 만들어 GitHub Releases에 올린다.
# 앱 안의 자동 업데이트는 이 릴리스에 함께 올라가는 latest.json을 바라본다.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      # 태그와 앱 버전이 어긋나면 latest.json에 엉뚱한 버전이 실려
      # 자동 업데이트가 조용히 동작하지 않는다. 여기서 미리 막는다.
      - name: 태그와 앱 버전 일치 확인
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "태그 $tag / tauri.conf $conf / Cargo.toml $cargo / package.json $pkg"
          if ($conf -ne $tag -or $cargo -ne $tag -or $pkg -ne $tag) {
            throw "버전이 서로 다릅니다. scripts/set_version.ps1 로 맞춘 뒤 다시 태그를 만드세요."
          }

      # 시크릿을 붙여넣을 때 끝에 줄바꿈이 딸려 들어가는 일이 흔하다.
      # 그대로 두면 base64 해독이 실패해 10분 빌드가 끝난 뒤 서명 단계에서 깨진다.
      # 여기서 미리 다듬고, 형식이 아예 틀렸으면 바로 멈춘다.
      - name: 서명 비밀값 확인
        shell: pwsh
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # 서명키가 없으면 설치본만 만들고 자동 업데이트 파일은 건너뛴다.
          # 나중에 시크릿을 등록하면 그때부터 자동 업데이트가 켜진다.
          if ([string]::IsNullOrWhiteSpace($env:RAW_KEY)) {
            Write-Host "::warning::서명키가 없어 자동 업데이트 파일 없이 설치본만 만듭니다. 자동 업데이트를 쓰려면 TAURI_SIGNING_PRIVATE_KEY 시크릿을 등록하세요."
            $path = "src-tauri/tauri.conf.json"
            $conf = Get-Content $path -Raw -Encoding utf8 | ConvertFrom-Json
            $conf.bundle.createUpdaterArtifacts = $false
            $conf | ConvertTo-Json -Depth 30 | Set-Content $path -Encoding utf8
            Write-Host "자동 업데이트 산출물 생성을 껐습니다."
            exit 0
          }

          $key = $env:RAW_KEY.Trim()
          $password = if ($null -eq $env:RAW_PASSWORD) { "" } else { $env:RAW_PASSWORD.Trim() }

          if ($key -match '\s') {
            throw "서명키 중간에 공백이나 줄바꿈이 있습니다. .signing\tauri.key 는 한 줄짜리 문자열입니다. 줄이 나뉘지 않게 다시 등록하세요."
          }

          try {
            $decoded = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($key))
          } catch {
            throw "서명키가 base64 형식이 아닙니다. .signing\tauri.key 파일 내용을 그대로 등록했는지 확인하세요."
          }

          if (-not $decoded.StartsWith("untrusted comment:")) {
            throw "서명키 내용이 올바르지 않습니다. 공개키(tauri.key.pub)가 아니라 개인키(tauri.key)를 등록했는지 확인하세요."
          }

          # 다듬은 값도 로그에 찍히지 않도록 가린 뒤 다음 단계로 넘긴다.
          Write-Host "::add-mask::$key"
          if ($password) { Write-Host "::add-mask::$password" }
          "TAURI_SIGNING_PRIVATE_KEY=$key" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "서명 비밀값 확인 완료"

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Python sidecar(bridge-runner)는 용량이 커서 저장소에 넣지 않는다.
      # 배포할 때마다 여기서 새로 만든다.
      - name: sidecar 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r bridge/requirements.txt

      - name: sidecar 빌드
        run: python -m PyInstaller --noconfirm --distpath src-tauri/binaries --workpath build-sidecar bridge/runner.spec

      - name: sidecar 확인
        shell: pwsh
        run: |
          $exe = "src-tauri/binaries/bridge-runner-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $exe)) { throw "sidecar 빌드 결과를 찾지 못했습니다: $exe" }
          "{0:N1} MB" -f ((Get-Item $exe).Length / 1MB)

      - name: pnpm 준비
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: 프론트엔드 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 타입 검사
        run: pnpm exec tsc --noEmit

      - name: Rust 준비
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 캐시
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 설치본 빌드 및 릴리스 발행
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 위 '서명 비밀값 확인' 단계에서 다듬어 둔 값을 그대로 쓴다.
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: JB업무ON ${{ github.ref_name }}
          releaseBody: |
            ## 설치 방법

            아래 `.exe` 설치 파일을 내려받아 실행하세요.
            이미 설치되어 있다면 앱이 알아서 이 버전으로 업데이트합니다.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
