[package]
name = "jbedu-automation-suite"
version = "1.5.2"
description = "반복 업무를 간단하게 만드는 전북교육 업무도구 모음"
authors = ["전북특별자치도교육청"]
edition = "2021"

[lib]
name = "jbedu_automation_suite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
minisign-verify = "0.2"
reqwest = { version = "0.13", features = ["blocking", "json", "rustls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tempfile = "3"
zip = { version = "4", default-features = false, features = ["deflate"] }
# 문서 검색(1.4.4): 색인 저장(SQLite FTS5)과 한국어 낱말 나누기(Lindera, mecab-ko-dic).
# lindera 는 사전 위치가 버전 번호 폴더(vendor/lindera/2.3.4)라서 버전을 못박는다.
rusqlite = { version = "0.37", features = ["bundled"] }
lindera = { version = "=2.3.4", default-features = false, features = ["embed-ko-dic"] }
walkdir = "2.5"
cfb = "0.7"
flate2 = "1"
quick-xml = "0.41"
encoding_rs = "0.8"
# 문서 검색 결과의 파일 아이콘: 윈도우가 준 아이콘을 PNG 로 바꿔 화면에 넘긴다.
png = "0.18"

[target.'cfg(windows)'.dependencies]
# 문서 검색 결과의 파일 아이콘을 탐색기에서 받아 온다(SHGetFileInfo·SHGetImageList).
# HTML 도구 그림을 클립보드에 넣는다(DataExchange·Memory, 1.5.1 지역별 수치·학교 위치 지도 시각화).
# PC 정보(1.5.2): 레지스트리·시스템 정보·디스크·네트워크·장치 목록·화면 배율을 읽는다(Registry 부터 HiDpi 까지).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Diagnostics_Debug", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WNet", "Win32_Networking_WinSock", "Win32_Devices_DeviceAndDriverInstallation", "Win32_UI_HiDpi"] }

